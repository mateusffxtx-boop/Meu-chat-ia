<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversa</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f24;
    --border: #2a2e35;
    --text: #e8e6e1;
    --muted: #8b8f97;
    --accent: #5b8def;
    --accent-dim: #2d3f5c;
    --user-bubble: #2a3a52;
    --ai-bubble: #23262c;
    --danger: #e05a5a;
    --code-bg: #0d0f12;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .appRow {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* ---------- Sidebar de histórico ---------- */
  #historySidebar {
    width: 260px;
    max-width: 80vw;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 20;
  }
  #historySidebar.open { transform: translateX(0); }

  #sidebarOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 19;
  }
  #sidebarOverlay.show { display: block; }

  #newChatBtn {
    margin: 14px;
    padding: 10px;
    background: var(--accent);
    border: none;
    color: white;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  #conversationList {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }

  .convItem {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 2px;
    gap: 6px;
  }
  .convItem:hover { background: rgba(255,255,255,0.05); }
  .convItem.active { background: var(--accent-dim); }
  .convItem .convTitle {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .convItem .convDelete {
    color: var(--muted);
    font-size: 14px;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .convItem .convDelete:hover { color: var(--danger); }

  /* ---------- Layout principal ---------- */
  #mainArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    gap: 10px;
  }

  .headerLeft {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  #menuBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  header .status {
    font-size: 12px;
    color: var(--muted);
  }

  .headerRight {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  #settingsBtn, #authBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #settingsBtn:hover, #authBtn:hover { color: var(--text); border-color: var(--accent); }

  #userChip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
  }
  #userChip.show { display: flex; }
  #userChip img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
  }

  #settingsPanel {
    display: none;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    gap: 10px;
    flex-direction: column;
  }
  #settingsPanel.open { display: flex; }

  #settingsPanel label {
    font-size: 12px;
    color: var(--muted);
  }

  #settingsPanel input, #settingsPanel select, #settingsPanel textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    width: 100%;
    font-family: inherit;
  }

  #settingsPanel .section-title {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 6px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  #settingsPanel .section-title:first-child {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--ai-bubble);
    border-bottom-left-radius: 3px;
    max-width: 90%;
  }

  .msg.assistant p { margin: 0 0 8px 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }

  .msg.error {
    align-self: center;
    background: rgba(224,90,90,0.12);
    border: 1px solid rgba(224,90,90,0.3);
    color: var(--danger);
    font-size: 13px;
    max-width: 90%;
  }

  .msg.info {
    align-self: center;
    background: rgba(91,141,239,0.1);
    border: 1px solid rgba(91,141,239,0.3);
    color: var(--accent);
    font-size: 12px;
    max-width: 90%;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--ai-bubble);
    color: var(--muted);
    font-style: italic;
  }

  /* ---------- Blocos de código ---------- */
  .codeBlock {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 8px 0;
    overflow: hidden;
    font-size: 13px;
  }
  .codeBlockHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
  }
  .codeCopyBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .codeCopyBtn:hover { color: var(--text); border-color: var(--accent); }
  .codeCopyBtn svg { width: 12px; height: 12px; }
  .codeBlock pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    white-space: pre;
  }
  .codeBlock code {
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 12.5px;
    color: #d8dce2;
  }
  .inlineCode {
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, Monaco, monospace;
    font-size: 12.5px;
  }

  footer {
    padding: 14px 20px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }

  #inputRow {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #promptInput {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    max-height: 140px;
    min-height: 44px;
  }
  #promptInput:focus { outline: none; border-color: var(--accent); }

  #sendBtn {
    background: var(--accent);
    border: none;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #sendBtn:disabled { background: var(--accent-dim); cursor: not-allowed; }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.1); }

  #clearBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 0 12px;
    height: 44px;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
  }
  #clearBtn:hover { color: var(--danger); border-color: var(--danger); }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="appRow">
  <div id="sidebarOverlay"></div>
  <div id="historySidebar">
    <button id="newChatBtn">+ Nova conversa</button>
    <div id="conversationList"></div>
  </div>

  <div id="mainArea">
    <header>
      <div class="headerLeft">
        <button id="menuBtn">☰</button>
        <div>
          <h1 id="convTitleHeader">Conversa</h1>
          <div class="status" id="statusLine">Nenhuma chave configurada</div>
        </div>
      </div>
      <div class="headerRight">
        <div id="userChip">
          <img id="userPhoto" src="" alt="">
          <span id="userName"></span>
        </div>
        <button id="authBtn">Entrar com Google</button>
        <button id="settingsBtn">Configurações</button>
      </div>
    </header>

    <div id="settingsPanel">
      <div class="section-title">IA (Gemini)</div>
      <div>
        <label for="apiKey">Chave da API do Gemini</label>
        <input type="password" id="apiKey" placeholder="AIza...">
      </div>
      <div>
        <label for="model">Modelo</label>
        <select id="model">
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.7-flash">gemini-3.7-flash</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash</option>
          <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
          <option value="gemini-3.1-flash">gemini-3.1-flash</option>
          <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
        </select>
      </div>
      <div>
        <label for="systemPrompt">Instrução do sistema (opcional)</label>
        <input type="text" id="systemPrompt" placeholder="Ex: Responda sempre em português, de forma direta.">
      </div>

      <div class="section-title">Login e sincronização (Firebase)</div>
      <div>
        <label for="firebaseConfig">Configuração do Firebase (cole o objeto firebaseConfig)</label>
        <textarea id="firebaseConfig" rows="4" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}'></textarea>
      </div>
      <button id="saveFirebaseBtn" style="background:var(--accent); color:white; border:none; border-radius:6px; padding:8px; font-size:12px; cursor:pointer;">Salvar e ativar sincronização</button>
    </div>

    <div id="chat"></div>

    <footer>
      <div id="inputRow">
        <textarea id="promptInput" placeholder="Escreva sua mensagem..." rows="1"></textarea>
        <button id="clearBtn" title="Apagar conversa atual">Limpar</button>
        <button id="sendBtn">➤</button>
      </div>
      <div class="hint">Sem login, a chave e o histórico ficam só neste navegador. Pegue sua chave grátis em aistudio.google.com/apikey</div>
    </footer>
  </div>
</div>

<script>
let firebaseApp = null;
let firebaseAuth = null;
let firestoreDb = null;
let currentUser = null;
let firebaseLoaded = false;

const chatEl = document.getElementById('chat');
const promptInput = document.getElementById('promptInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const apiKeyInput = document.getElementById('apiKey');
const modelSelect = document.getElementById('model');
const systemPromptInput = document.getElementById('systemPrompt');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const statusLine = document.getElementById('statusLine');
const authBtn = document.getElementById('authBtn');
const userChip = document.getElementById('userChip');
const userPhoto = document.getElementById('userPhoto');
const userName = document.getElementById('userName');
const firebaseConfigInput = document.getElementById('firebaseConfig');
const saveFirebaseBtn = document.getElementById('saveFirebaseBtn');
const menuBtn = document.getElementById('menuBtn');
const historySidebar = document.getElementById('historySidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');
const newChatBtn = document.getElementById('newChatBtn');
const conversationList = document.getElementById('conversationList');
const convTitleHeader = document.getElementById('convTitleHeader');

// ---------- Estado das conversas ----------
// conversations: [{ id, title, messages: [{role, content}], updatedAt }]
let conversations = JSON.parse(localStorage.getItem('chat_conversations') || 'null');
let activeConvId = localStorage.getItem('active_conv_id');

if (!conversations || !Array.isArray(conversations) || conversations.length === 0) {
  // Migrar histórico antigo (formato de versão anterior), se existir
  const oldHistory = JSON.parse(localStorage.getItem('chat_history') || '[]');
  const firstConv = {
    id: 'conv_' + Date.now(),
    title: 'Nova conversa',
    messages: oldHistory,
    updatedAt: Date.now()
  };
  conversations = [firstConv];
  activeConvId = firstConv.id;
}

if (!activeConvId || !conversations.find(c => c.id === activeConvId)) {
  activeConvId = conversations[0].id;
}

function getActiveConv() {
  return conversations.find(c => c.id === activeConvId);
}

function persistConversations() {
  localStorage.setItem('chat_conversations', JSON.stringify(conversations));
  localStorage.setItem('active_conv_id', activeConvId);
}

apiKeyInput.value = localStorage.getItem('chat_api_key') || '';
modelSelect.value = localStorage.getItem('chat_model') || 'gemini-3.6-flash';
systemPromptInput.value = localStorage.getItem('chat_system_prompt') || '';
firebaseConfigInput.value = localStorage.getItem('firebase_config') || '';

function updateStatus() {
  let base = apiKeyInput.value
    ? `Modelo: ${modelSelect.value}`
    : 'Nenhuma chave configurada';
  if (currentUser) base += ' · sincronizado';
  statusLine.textContent = base;
}
updateStatus();

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

[apiKeyInput, modelSelect, systemPromptInput].forEach(el => {
  el.addEventListener('change', () => {
    localStorage.setItem('chat_api_key', apiKeyInput.value);
    localStorage.setItem('chat_model', modelSelect.value);
    localStorage.setItem('chat_system_prompt', systemPromptInput.value);
    updateStatus();
  });
});

// ---------- Sidebar ----------
menuBtn.addEventListener('click', () => {
  historySidebar.classList.add('open');
  sidebarOverlay.classList.add('show');
});
sidebarOverlay.addEventListener('click', closeSidebar);
function closeSidebar() {
  historySidebar.classList.remove('open');
  sidebarOverlay.classList.remove('show');
}

function renderConversationList() {
  conversationList.innerHTML = '';
  const sorted = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt);
  sorted.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'convItem' + (conv.id === activeConvId ? ' active' : '');

    const title = document.createElement('div');
    title.className = 'convTitle';
    title.textContent = conv.title || 'Nova conversa';
    title.addEventListener('click', () => switchConversation(conv.id));

    const del = document.createElement('div');
    del.className = 'convDelete';
    del.textContent = '✕';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConversation(conv.id);
    });

    item.appendChild(title);
    item.appendChild(del);
    conversationList.appendChild(item);
  });
}

function switchConversation(id) {
  activeConvId = id;
  persistConversations();
  renderConversationList();
  renderHistory();
  updateHeaderTitle();
  closeSidebar();
  syncConversationsToCloud();
}

function deleteConversation(id) {
  conversations = conversations.filter(c => c.id !== id);
  if (conversations.length === 0) {
    const fresh = { id: 'conv_' + Date.now(), title: 'Nova conversa', messages: [], updatedAt: Date.now() };
    conversations.push(fresh);
  }
  if (activeConvId === id) {
    activeConvId = conversations[0].id;
  }
  persistConversations();
  renderConversationList();
  renderHistory();
  updateHeaderTitle();
  syncConversationsToCloud();
}

newChatBtn.addEventListener('click', () => {
  const fresh = { id: 'conv_' + Date.now(), title: 'Nova conversa', messages: [], updatedAt: Date.now() };
  conversations.push(fresh);
  activeConvId = fresh.id;
  persistConversations();
  renderConversationList();
  renderHistory();
  updateHeaderTitle();
  closeSidebar();
  syncConversationsToCloud();
});

function updateHeaderTitle() {
  const conv = getActiveConv();
  convTitleHeader.textContent = conv ? (conv.title || 'Nova conversa') : 'Conversa';
}

    word-wrap: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--ai-bubble);
    border-bottom-left-radius: 3px;
  }

  .msg.error {
    align-self: center;
    background: rgba(224,90,90,0.12);
    border: 1px solid rgba(224,90,90,0.3);
    color: var(--danger);
    font-size: 13px;
    max-width: 90%;
  }

  .msg.info {
    align-self: center;
    background: rgba(91,141,239,0.1);
    border: 1px solid rgba(91,141,239,0.3);
    color: var(--accent);
    font-size: 12px;
    max-width: 90%;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--ai-bubble);
    color: var(--muted);
    font-style: italic;
  }

  footer {
    padding: 14px 20px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }

  #inputRow {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #promptInput {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    max-height: 140px;
    min-height: 44px;
  }
  #promptInput:focus { outline: none; border-color: var(--accent); }

  #sendBtn {
    background: var(--accent);
    border: none;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #sendBtn:disabled { background: var(--accent-dim); cursor: not-allowed; }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.1); }

  #clearBtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 0 12px;
    height: 44px;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
  }
  #clearBtn:hover { color: var(--danger); border-color: var(--danger); }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Conversa</h1>
    <div class="status" id="statusLine">Nenhuma chave configurada</div>
  </div>
  <div class="headerRight">
    <div id="userChip">
      <img id="userPhoto" src="" alt="">
      <span id="userName"></span>
    </div>
    <button id="authBtn">Entrar com Google</button>
    <button id="settingsBtn">Configurações</button>
  </div>
</header>

<div id="settingsPanel">
  <div class="section-title">IA (Gemini)</div>
  <div>
    <label for="apiKey">Chave da API do Gemini</label>
    <input type="password" id="apiKey" placeholder="AIza...">
  </div>
  <div>
    <label for="model">Modelo</label>
    <select id="model">
      <option value="gemini-3.8-flash">gemini-3.8-flash</option>
      <option value="gemini-3.7-flash">gemini-3.7-flash</option>
      <option value="gemini-3.6-flash">gemini-3.6-flash</option>
      <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
      <option value="gemini-3.1-flash">gemini-3.1-flash</option>
      <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
    </select>
  </div>
  <div>
    <label for="systemPrompt">Instrução do sistema (opcional)</label>
    <input type="text" id="systemPrompt" placeholder="Ex: Responda sempre em português, de forma direta.">
  </div>

  <div class="section-title">Login e sincronização (Firebase)</div>
  <div>
    <label for="firebaseConfig">Configuração do Firebase (cole o objeto firebaseConfig)</label>
    <textarea id="firebaseConfig" rows="4" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}'></textarea>
  </div>
  <button id="saveFirebaseBtn" style="background:var(--accent); color:white; border:none; border-radius:6px; padding:8px; font-size:12px; cursor:pointer;">Salvar e ativar sincronização</button>
</div>

<div id="chat"></div>

<footer>
  <div id="inputRow">
    <textarea id="promptInput" placeholder="Escreva sua mensagem..." rows="1"></textarea>
    <button id="clearBtn" title="Limpar conversa">Limpar</button>
    <button id="sendBtn">➤</button>
  </div>
  <div class="hint">Sem login, a chave e o histórico ficam só neste navegador. Pegue sua chave grátis em aistudio.google.com/apikey</div>
</footer>

<!-- Firebase SDKs (compat, carregam sob demanda) -->
<script>
let firebaseApp = null;
let firebaseAuth = null;
let firestoreDb = null;
let currentUser = null;
let firebaseLoaded = false;

const chatEl = document.getElementById('chat');
const promptInput = document.getElementById('promptInput');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const apiKeyInput = document.getElementById('apiKey');
const modelSelect = document.getElementById('model');
const systemPromptInput = document.getElementById('systemPrompt');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const statusLine = document.getElementById('statusLine');
const authBtn = document.getElementById('authBtn');
const userChip = document.getElementById('userChip');
const userPhoto = document.getElementById('userPhoto');
const userName = document.getElementById('userName');
const firebaseConfigInput = document.getElementById('firebaseConfig');
const saveFirebaseBtn = document.getElementById('saveFirebaseBtn');

let history = JSON.parse(localStorage.getItem('chat_history') || '[]');
apiKeyInput.value = localStorage.getItem('chat_api_key') || '';
modelSelect.value = localStorage.getItem('chat_model') || 'gemini-3.6-flash';
systemPromptInput.value = localStorage.getItem('chat_system_prompt') || '';
firebaseConfigInput.value = localStorage.getItem('firebase_config') || '';

function updateStatus() {
  let base = apiKeyInput.value
    ? `Modelo: ${modelSelect.value}`
    : 'Nenhuma chave configurada';
  if (currentUser) base += ' · sincronizado';
  statusLine.textContent = base;
}
updateStatus();

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

[apiKeyInput, modelSelect, systemPromptInput].forEach(el => {
  el.addEventListener('change', () => {
    localStorage.setItem('chat_api_key', apiKeyInput.value);
    localStorage.setItem('chat_model', modelSelect.value);
    localStorage.setItem('chat_system_prompt', systemPromptInput.value);
    updateStatus();
  });
});

function renderMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function renderHistory() {
  chatEl.innerHTML = '';
  history.forEach(m => renderMessage(m.role, m.content));
}
renderHistory();

async function saveHistory() {
  localStorage.setItem('chat_history', JSON.stringify(history));
  if (currentUser && firestoreDb) {
    try {
      await firestoreDb.collection('chats').doc(currentUser.uid).set({
        history: history,
        updatedAt: new Date().toISOString()
      });
    } catch (err) {
      renderMessage('error', 'Falha ao sincronizar: ' + err.message);
    }
  }
}

// ---------- Firebase setup ----------
function loadFirebaseSdk(callback) {
  if (firebaseLoaded) { callback(); return; }
  const scripts = [
    'https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js'
  ];
  let loadedCount = 0;
  scripts.forEach(src => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => {
      loadedCount++;
      if (loadedCount === scripts.length) {
        firebaseLoaded = true;
        callback();
      }
    };
    document.head.appendChild(s);
  });
}

function initFirebase(configStr) {
  try {
    const config = JSON.parse(configStr);
    loadFirebaseSdk(() => {
      firebaseApp = firebase.initializeApp(config);
      firebaseAuth = firebase.auth();
      firestoreDb = firebase.firestore();
      authBtn.disabled = false;

      firebaseAuth.onAuthStateChanged(async (user) => {
        if (user) {
          currentUser = user;
          userChip.classList.add('show');
          userPhoto.src = user.photoURL || '';
          userName.textContent = user.displayName || user.email;
          authBtn.textContent = 'Sair';
          updateStatus();

          // Carregar histórico da nuvem
          try {
            const doc = await firestoreDb.collection('chats').doc(user.uid).get();
            if (doc.exists && doc.data().history) {
              history = doc.data().history;
              localStorage.setItem('chat_history', JSON.stringify(history));
              renderHistory();
              renderMessage('info', 'Histórico sincronizado carregado.');
            }
          } catch (err) {
            renderMessage('error', 'Falha ao carregar histórico da nuvem: ' + err.message);
          }
        } else {
          currentUser = null;
          userChip.classList.remove('show');
          authBtn.textContent = 'Entrar com Google';
          updateStatus();
        }
      });
    });
  } catch (err) {
    renderMessage('error', 'Configuração do Firebase inválida: ' + err.message);
  }
}

saveFirebaseBtn.addEventListener('click', () => {
  const val = firebaseConfigInput.value.trim();
  if (!val) return;
  localStorage.setItem('firebase_config', val);
  initFirebase(val);
  settingsPanel.classList.remove('open');
});

authBtn.addEventListener('click', async () => {
  if (!firebaseAuth) {
    settingsPanel.classList.add('open');
    firebaseConfigInput.focus();
    return;
  }
  if (currentUser) {
    await firebaseAuth.signOut();
  } else {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await firebaseAuth.signInWithPopup(provider);
    } catch (err) {
      renderMessage('error', 'Falha no login: ' + err.message);
    }
  }
});

// Ativar sincronização automaticamente se já houver config salva
const savedFirebaseConfig = localStorage.getItem('firebase_config');
if (savedFirebaseConfig) {
  authBtn.disabled = true;
  authBtn.textContent = 'Carregando...';
  initFirebase(savedFirebaseConfig);
} else {
  authBtn.disabled = true;
  authBtn.title = 'Configure o Firebase em Configurações primeiro';
}

// ---------- Chat ----------
promptInput.addEventListener('input', () => {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + 'px';
});

promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

clearBtn.addEventListener('click', () => {
  history = [];
  saveHistory();
  renderHistory();
});

async function sendMessage() {
  const text = promptInput.value.trim();
  const apiKey = apiKeyInput.value.trim();

  if (!apiKey) {
    settingsPanel.classList.add('open');
    apiKeyInput.focus();
    return;
  }
  if (!text) return;

  history.push({ role: 'user', content: text });
  renderMessage('user', text);
  saveHistory();
  promptInput.value = '';
  promptInput.style.height = 'auto';

  sendBtn.disabled = true;
  const typingEl = renderMessage('typing', 'Digitando...');

  const contents = history.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));

  const body = { contents };
  const sys = systemPromptInput.value.trim();
  if (sys) {
    body.systemInstruction = { parts: [{ text: sys }] };
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelSelect.value}:generateContent?key=${apiKey}`;

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    typingEl.remove();

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      const errMsg = errData?.error?.message || `Erro HTTP ${response.status}`;
      renderMessage('error', errMsg);
      sendBtn.disabled = false;
      return;
    }

    const data = await response.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(resposta vazia)';
    history.push({ role: 'assistant', content: reply });
    renderMessage('assistant', reply);
    saveHistory();
  } catch (err) {
    typingEl.remove();
    renderMessage('error', 'Falha de conexão: ' + err.message);
  }

  sendBtn.disabled = false;
  promptInput.focus();
}
</script>

</body>
</html>
